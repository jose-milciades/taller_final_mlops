name: CI/CD

on:
  push:
    branches:
      - dev
      - prod

env:
  IMAGE_NAME: onnx-fastapi-deploy

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install dependencies
        run: pip install -e ".[test,cloud]"

      - name: Download test data
        if: ${{ vars.TEST_DATA_URI != '' }}
        run: python scripts/download_artifacts.py --test-data
        env:
          TEST_DATA_URI: ${{ vars.TEST_DATA_URI }}

      - name: Download model
        run: python scripts/download_artifacts.py --model
        env:
          MODEL_URI: ${{ vars.MODEL_URI }}

      - name: Run tests
        run: pytest
        env:
          MODEL_PATH: artifacts/model.onnx
          TEST_DATA_PATH: artifacts/test_data.json

  build-promote:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install artifact dependencies
        run: pip install -e ".[cloud]"

      - name: Download model
        run: python scripts/download_artifacts.py --model
        env:
          MODEL_URI: ${{ vars.MODEL_URI }}

      - name: Build image
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}"
          docker build \
            -t "${IMAGE_URI}" \
            .
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Push image
        run: docker push "${IMAGE_URI}"

      - name: Promote deployment
        run: ./scripts/promote.sh
        env:
          APP_ENV: ${{ github.ref_name }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          PREDICTIONS_LOG_URI: ${{ vars.PREDICTIONS_LOG_URI }}
