[project]
name = "onnx-fastapi-deploy"
version = "0.1.0"
description = "FastAPI service and CI/CD scaffold for automatic ONNX model deployment."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "onnxruntime==1.20.1",
    "numpy==2.2.1",
    "pydantic-settings==2.7.1",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-storage==2.19.0",
]
test = [
    "httpx==0.28.1",
    "onnx==1.17.0",
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
